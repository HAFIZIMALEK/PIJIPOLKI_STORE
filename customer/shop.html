<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Shop the ShopSphere catalogue: search, filter and add products to your cart.">
  <meta name="author" content="IMS566 Student">
  <meta name="keywords" content="shop, products, e-commerce, cart">
  <title>Shop | ShopSphere</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
  <script src="../js/store.js"></script>
  <script src="../js/auth.js"></script>
  <script>requireRole("customer");</script>

  <div id="app-navbar" data-active="shop"></div>

  <main class="container py-4">
    <section class="welcome-banner p-4 mb-4" aria-label="Account summary">
      <h1 class="h3 fw-bold mb-1" id="welcomeTitle">Welcome</h1>
      <p class="mb-3 opacity-75">Browse products, pay securely and track your orders.</p>
      <div class="row g-2 text-center" id="summaryStrip"></div>
    </section>

    <header class="page-header d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
      <div><h2 class="h4 fw-bold mb-0">Products</h2><p id="productCount">Catalogue</p></div>
    </header>

    <section class="card mb-4"><div class="card-body">
      <div class="row g-2">
        <div class="col-md-5"><div class="input-group"><span class="input-group-text"><i class="bi bi-search"></i></span>
          <input type="search" id="searchBox" class="form-control" placeholder="Search products..."></div></div>
        <div class="col-6 col-md-3"><select id="categoryFilter" class="form-select" aria-label="Filter by category"><option value="">All categories</option></select></div>
        <div class="col-6 col-md-4"><select id="sortSelect" class="form-select" aria-label="Sort products">
          <option value="name">Sort: Name (A-Z)</option><option value="priceAsc">Price: Low to High</option>
          <option value="priceDesc">Price: High to Low</option><option value="rating">Top Rated</option></select></div>
      </div>
    </div></section>

    <section id="gridView" class="row g-3" aria-label="Product list"></section>
    <div id="emptyMsg" class="text-center text-muted py-5 d-none"><i class="bi bi-emoji-frown fs-1"></i><p class="mt-2">No products match your search.</p></div>
  </main>

  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="toast" class="toast align-items-center border-0 text-bg-success" role="status">
      <div class="d-flex"><div class="toast-body" id="toastMsg"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button></div>
    </div>
  </div>

  <div id="app-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/shop.js"></script>
</body>
</html>
