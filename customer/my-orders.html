<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Track your ShopSphere orders, payment status and delivery progress.">
  <meta name="author" content="IMS566 Student">
  <meta name="keywords" content="my orders, order tracking, payment status">
  <title>My Orders | ShopSphere</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
  <script src="../js/store.js"></script>
  <script src="../js/auth.js"></script>
  <script>requireRole("customer");</script>

  <div id="app-navbar" data-active="orders"></div>

  <main class="container py-4">
    <header class="page-header mb-3"><h1>My Orders</h1><p id="orderCount">Your purchases and their status</p></header>
    <div id="pageAlert"></div>

    <div class="mb-3 d-flex flex-wrap gap-2" id="filterChips" role="group" aria-label="Filter by status"></div>
    <section id="orderList" class="vstack gap-3" aria-label="Orders"></section>

    <div id="emptyMsg" class="card d-none"><div class="card-body text-center py-5">
      <div class="fs-1">📦</div><h5 class="mt-2">No orders here yet</h5>
      <a href="shop.html" class="btn btn-primary mt-2">Go shopping</a></div></div>
  </main>

  <div class="modal fade" id="detailModal" tabindex="-1" aria-labelledby="detailTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="detailTitle">Order details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body" id="detailBody"></div>
    </div></div>
  </div>

  <div id="app-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/payment.js"></script>
  <script src="../js/my-orders.js"></script>
</body>
</html>
