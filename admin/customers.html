<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Admin customer directory for ShopSphere with order counts and lifetime spending.">
  <meta name="author" content="IMS566 Student">
  <meta name="keywords" content="admin, customers, directory, spending">
  <title>Customers | ShopSphere Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
  <script src="../js/store.js"></script>
  <script src="../js/auth.js"></script>
  <script>requireRole("admin");</script>

  <div id="app-navbar" data-active="customers"></div>

  <main class="container py-4">
    <header class="page-header mb-4"><h1>Customers</h1><p id="custCount">Registered customers and their lifetime spending.</p></header>
    <div class="row g-3">
      <div class="col-lg-7"><section class="card h-100" aria-label="Customer table"><div class="card-body">
        <div class="table-responsive"><table class="table table-modern table-hover mb-0">
          <thead><tr><th>Customer</th><th>Joined</th><th class="text-end">Orders</th><th class="text-end">Spent</th></tr></thead>
          <tbody id="customerRows"></tbody></table></div></div></section></div>
      <div class="col-lg-5"><section class="card h-100" aria-label="Top customers chart"><div class="card-body">
        <h5 class="card-title">Top Customers by Spending</h5>
        <p class="text-muted small">Paid orders only, highest first. The chart fills in after customers pay.</p>
        <div class="chart-box" style="height:340px"><canvas id="customerChart"></canvas></div></div></section></div>
    </div>
  </main>

  <div id="app-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/admin-customers.js"></script>
</body>
</html>
