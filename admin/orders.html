<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Admin order management for ShopSphere: view payments and update delivery status.">
  <meta name="author" content="IMS566 Student">
  <meta name="keywords" content="admin, orders, payments, shipping, status">
  <title>Manage Orders | ShopSphere Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
  <script src="../js/store.js"></script>
  <script src="../js/auth.js"></script>
  <script>requireRole("admin");</script>

  <div id="app-navbar" data-active="orders"></div>

  <main class="container py-4">
    <header class="page-header mb-4"><h1>Orders</h1><p id="orderCount">All customer orders</p></header>
    <div id="pageAlert"></div>

    <section class="card mb-3"><div class="card-body"><div class="row g-2">
      <div class="col-md-5"><div class="input-group"><span class="input-group-text"><i class="bi bi-search"></i></span>
        <input type="search" id="searchBox" class="form-control" placeholder="Search by order ID or customer..."></div></div>
      <div class="col-6 col-md-4"><select id="statusFilter" class="form-select" aria-label="Order status">
        <option value="">All order statuses</option><option>Pending Payment</option><option>Processing</option><option>Shipped</option><option>Delivered</option><option>Cancelled</option></select></div>
      <div class="col-6 col-md-3"><select id="payFilter" class="form-select" aria-label="Payment status">
        <option value="">All payments</option><option>Paid</option><option>Unpaid</option><option>Refunded</option></select></div>
    </div></div></section>

    <section class="card" aria-label="Orders table"><div class="card-body">
      <p class="text-muted small mb-2"><i class="bi bi-info-circle me-1"></i>Click a column heading to sort. Status changes show up instantly on the customer's My Orders page.</p>
      <div class="table-responsive"><table class="table table-modern table-hover mb-0">
        <thead><tr>
          <th class="sortable" data-key="id">Order <i class="bi bi-arrow-down-up small"></i></th>
          <th class="sortable" data-key="customerName">Customer <i class="bi bi-arrow-down-up small"></i></th>
          <th class="sortable" data-key="createdAt">Date <i class="bi bi-arrow-down-up small"></i></th>
          <th class="sortable" data-key="total">Total <i class="bi bi-arrow-down-up small"></i></th>
          <th>Payment</th>
          <th class="sortable" data-key="status">Status <i class="bi bi-arrow-down-up small"></i></th>
          <th class="text-end">Actions</th></tr></thead>
        <tbody id="orderRows"></tbody>
        <tfoot><tr class="fw-bold"><td colspan="3" class="text-end">Paid revenue in list:</td><td id="sumCell" colspan="4"></td></tr></tfoot>
      </table></div>
      <div id="emptyMsg" class="text-center text-muted py-4 d-none">No orders found. Orders placed from the customer pages will appear here.</div>
    </div></section>
  </main>

  <div class="modal fade" id="detailModal" tabindex="-1" aria-labelledby="detailTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="detailTitle">Order details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body" id="detailBody"></div>
    </div></div>
  </div>

  <div id="app-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/admin-orders.js"></script>
</body>
</html>
