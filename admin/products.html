<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Admin product management for ShopSphere: add, edit, restock and remove products.">
  <meta name="author" content="IMS566 Student">
  <meta name="keywords" content="admin, products, inventory, stock">
  <title>Manage Products | ShopSphere Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
  <script src="../js/store.js"></script>
  <script src="../js/auth.js"></script>
  <script>requireRole("admin");</script>

  <div id="app-navbar" data-active="products"></div>

  <main class="container py-4">
    <header class="page-header d-flex flex-wrap justify-content-between align-items-end gap-2 mb-4">
      <div><h1>Products</h1><p id="productCount">Inventory</p></div>
      <button class="btn btn-primary" id="addBtn"><i class="bi bi-plus-lg me-1"></i>Add product</button>
    </header>
    <div id="pageAlert"></div>

    <section class="card mb-3"><div class="card-body"><div class="row g-2">
      <div class="col-md-6"><div class="input-group"><span class="input-group-text"><i class="bi bi-search"></i></span>
        <input type="search" id="searchBox" class="form-control" placeholder="Search by name or ID..."></div></div>
      <div class="col-md-3"><select id="categoryFilter" class="form-select" aria-label="Category"><option value="">All categories</option></select></div>
      <div class="col-md-3"><select id="stockFilter" class="form-select" aria-label="Stock level">
        <option value="">All stock levels</option><option value="low">Low stock (10 or fewer)</option><option value="out">Out of stock</option></select></div>
    </div></div></section>

    <section class="card" aria-label="Product table"><div class="card-body"><div class="table-responsive">
      <table class="table table-modern table-hover mb-0">
        <thead><tr><th>ID</th><th>Product</th><th>Category</th><th class="text-end">Price</th><th class="text-end">Stock</th><th class="text-end">Units sold</th><th class="text-end">Actions</th></tr></thead>
        <tbody id="productRows"></tbody></table></div>
      <div id="emptyMsg" class="text-center text-muted py-4 d-none">No products found.</div></div></section>
  </main>

  <div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><form class="modal-content" id="productForm" novalidate>
      <div class="modal-header"><h5 class="modal-title" id="productModalTitle">Add product</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body">
        <div id="formAlert"></div>
        <div class="row g-2">
          <div class="col-9"><label class="form-label small" for="fName">Product name</label><input id="fName" class="form-control" maxlength="60"></div>
          <div class="col-3"><label class="form-label small" for="fIcon">Emoji</label><input id="fIcon" class="form-control text-center" maxlength="4" value="📦"></div>
          <div class="col-6"><label class="form-label small" for="fCategory">Category</label><input id="fCategory" class="form-control" list="catList" maxlength="30"><datalist id="catList"></datalist></div>
          <div class="col-3"><label class="form-label small" for="fPrice">Price (RM)</label><input id="fPrice" type="number" min="0.01" step="0.01" class="form-control"></div>
          <div class="col-3"><label class="form-label small" for="fStock">Stock</label><input id="fStock" type="number" min="0" step="1" class="form-control"></div>
        </div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save product</button></div>
    </form></div>
  </div>

  <div id="app-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/admin-products.js"></script>
</body>
</html>
